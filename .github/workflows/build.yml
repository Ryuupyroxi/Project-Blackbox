name: Build Blackbox APK

permissions:
  contents: write

on:
  push:
    branches: [main, v1.2-beta]
  workflow_dispatch:

concurrency:
  group: build-blackbox-apk
  cancel-in-progress: false   # never abort a running build; new runs queue

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: sdkmanager "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download Termux bootstrap (embedded LOCAL runtime)
        run: bash tools/download-bootstrap.sh
        continue-on-error: true


      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          GRADLE_OPTS: "-Dorg.gradle.workers.max=2"

      - name: Upload Gradle log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blackbox-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Compute release metadata
        if: success()
        id: meta
        run: |
          VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=${VER:-unknown}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create Release with APK
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: daily-build-${{ github.run_number }}
          name: Daily Build — v${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.date }})
          body: |
            Automated daily APK build from main.

            Version: v${{ steps.meta.outputs.version }} (versionCode 1200)
            Built: ${{ steps.meta.outputs.date }} UTC
            Commit: ${{ steps.meta.outputs.sha }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
